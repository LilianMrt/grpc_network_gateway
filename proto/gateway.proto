syntax = "proto3";
package grpc.connectivity;

// Every write RPC, and ListRoutes, fails with one of these codes, the same on
// every RPC:
//   UNAVAILABLE          the database cannot be reached, including a pool
//                        acquire timeout (5s). Retryable.
//   INVALID_ARGUMENT     a field breaks the bounds below, checked before any
//                        write, or the database rejects a value (SQLSTATE
//                        classes 22 and 23). Permanent: do not retry unchanged.
//   FAILED_PRECONDITION  CreateVpnTunnel only: the route is owned by another
//                        resource. A foreign-owner delete is not an error; it
//                        succeeds with existed = false.
//   INTERNAL             anything unexpected.
// ListRoutes normally fails UNAVAILABLE or INTERNAL. Callers must treat any
// non-OK status as "actual state unknown", never as an empty list: an empty
// list means the database answered and holds no routes.
//
// vpn_routes is the only authority on which tunnels exist. ListRoutes reads it
// directly and is the actual state a reconciler must use. GetGatewayStatus and
// RoutePacket read the serving pod's in-memory cache, which can lag or differ
// between pods: GetGatewayStatus is a pod-local debug view, never a stand-in
// for ListRoutes.
service GatewayController {
  rpc CreateVpnTunnel (TunnelRequest) returns (TunnelResponse);
  rpc RoutePacket (PacketRequest) returns (PacketResponse);
  rpc DeleteVpnTunnel (DeleteTunnelRequest) returns (DeleteTunnelResponse);
  rpc GetGatewayStatus (StatusRequest) returns (StatusResponse);
  rpc ListRoutes (ListRoutesRequest) returns (ListRoutesResponse);
}

// Bounds are the vpn_routes column widths, counted in characters (Postgres
// VARCHAR semantics), not bytes. The gateway checks them in the order
// local_ip, owner, tunnel_id, remote_endpoint; CRD validation mirrors them.
message TunnelRequest {
  // Required, 1 to 255 characters.
  string tunnel_id = 1;
  // A dotted IPv4 address, e.g. "10.0.0.5". The route's key.
  string local_ip = 2;
  // "host:port", at most 255 characters, split on the last ':'. port: ASCII
  // digits, 1 to 65535; leading zeros are accepted ("h:080" is port 80). host: a dotted IPv4 address (no leading zeros), or an
  // RFC 1123 hostname: dot-separated labels of 1 to 63 [A-Za-z0-9-], no
  // leading or trailing '-', at most 253 characters, no trailing dot. A host of
  // only digits and dots must be a valid IPv4 address. No IPv6.
  string remote_endpoint = 3;
  // The resource that owns this route, "<namespace>/<name>". Required. Create
  // claims a missing route or updates the caller's own; a route held by another
  // owner is refused with FAILED_PRECONDITION and left unchanged.
  string owner = 4;
}

message TunnelResponse {
  bool success = 1;
  string status_message = 2;
}

// Tunnels are keyed on local_ip, which is the unique column in vpn_routes.
message DeleteTunnelRequest {
  // A dotted IPv4 address.
  string local_ip = 1;
  // Required. Only a route this owner holds is deleted.
  string owner = 2;
}

// Idempotent within the caller's ownership: deleting an absent tunnel, or one
// held by another owner, succeeds without removing anything, so a reconcile loop
// can retry freely. existed = false tells the caller it had no such route.
message DeleteTunnelResponse {
  bool success = 1;
  bool existed = 2;
  string status_message = 3;
}

message PacketRequest {
  bytes payload = 2;
}

message PacketResponse {
  string action = 1; // e.g., "FORWARDED", "DROPPED"
  uint32 bytes_processed = 2;
}

message StatusRequest {}

message RouteDetails {
  string destination_ip = 1;
  string tunnel_id = 2;
  string remote_endpoint = 3;
}

message StatusResponse {
  repeated RouteDetails active_routes = 1;
}

message ListRoutesRequest {}

// Every row of vpn_routes, in no particular order: callers key on local_ip,
// which is unique, so there is at most one Route per local_ip. There is no
// pagination: everything comes in one message, so it is subject to the
// client's decode limit (tonic default 4 MiB, roughly 7,000 routes at maximum
// field widths). Raise max_decoding_message_size if that is ever reached.
message ListRoutesResponse {
  repeated Route routes = 1;
}

// One persisted route, each field copied verbatim from its vpn_routes row. No
// field is parsed or normalised, and no row is filtered out. A route is
// "already correct" when tunnel_id and remote_endpoint both equal the desired
// values by exact string comparison; nothing else is compared. Ownership and
// bookkeeping columns are not exposed.
message Route {
  string local_ip = 1;
  string tunnel_id = 2;
  string remote_endpoint = 3;
}
