# Local single-node cluster for developing the gateway and, later, its operator.
#
# The port mapping lets tooling on the host (examples/smoke_client.rs,
# examples/health_probe.rs) talk to the in-cluster gateway without port-forward.
# It is bound to 127.0.0.1 deliberately: kind publishes through Docker, and.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: netgw
#
# The node image is pinned because this host (WSL2) mounts cgroup v1, and the
# kubelet from Kubernetes 1.36 onward refuses to start on it. v1.33 still
# tolerates cgroup v1. Drop this pin once the host runs the unified hierarchy
# (add `kernelCommandLine = cgroup_no_v1=all` to .wslconfig, then wsl --shutdown).
nodes:
  - role: control-plane
    image: kindest/node:v1.33.1
    extraPortMappings:
      - containerPort: 30051
        hostPort: 50051
        listenAddress: "127.0.0.1"
        protocol: TCP
