# Development credentials only. They match compose.yaml so local and cluster
# behave identically, and they are committed deliberately because there is
# nothing to protect. A real deployment sources this from a secret manager and
# never stores it in git.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-db
  namespace: netgw
type: Opaque
stringData:
  POSTGRES_USER: network_gateway_user
  POSTGRES_PASSWORD: network_gateway_password
  POSTGRES_DB: network_gateway_db
  # The gateway reads this single variable; see src/main.rs.
  DATABASE_URL: postgres://network_gateway_user:network_gateway_password@postgres.netgw.svc.cluster.local:5432/network_gateway_db
