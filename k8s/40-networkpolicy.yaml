# ---------------------------------------------------------------------------
# VERIFIED NOT ENFORCED ON THIS CLUSTER (2026-09-19).
#
# kind's default CNI is kindnet, which does not implement NetworkPolicy. The
# API server accepts these objects and stores them, and `kubectl get
# networkpolicy` lists them, but nothing acts on them. Tested directly: a pod
# labelled app=intruder reached postgres:5432 despite postgres-ingress, and
# pg_isready returned "accepting connections".
#
# This is the trap worth remembering: an unenforced NetworkPolicy is worse than
# no NetworkPolicy, because the manifests read as though the namespace is
# locked down. Never infer enforcement from the object existing; prove it with
# a pod that the policy should block.
#
# The policies below are correct and would take effect on any CNI that
# implements them (Calico, Cilium). To enforce locally, recreate the cluster
# with `disableDefaultCNI: true` in kind/cluster.yaml and install Calico. That
# is deferred here because this host has 3.7 GB of RAM total.
# ---------------------------------------------------------------------------

# Default deny for the whole namespace. Every flow below has to be named
# explicitly, which is the point: an allow-list makes the intended topology
# readable from the manifests alone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: netgw
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# The gateway accepts gRPC from anywhere: traffic arrives via NodePort, so the
# source is the node rather than a pod and cannot be expressed as a selector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
  namespace: netgw
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 50051
---
# The gateway needs exactly two things: DNS, and Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-egress
  namespace: netgw
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# Postgres accepts connections from the gateway and from nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: netgw
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 5432
