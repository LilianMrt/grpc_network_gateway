apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: netgw
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      # Matches the extraPortMapping in kind/cluster.yaml, so tooling on the
      # host reaches the cluster at 127.0.0.1:50051 with no port-forward.
      nodePort: 30051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: netgw
spec:
  # Deliberately 1, and there is deliberately no PodDisruptionBudget.
  #
  # Two replicas would not be correct today. Each pod hydrates the routing table
  # into memory at startup and never revalidates it; CreateVpnTunnel writes the
  # caller's own pod plus Postgres, and GetGatewayStatus reads that pod's memory.
  # So a create served by pod A is invisible to pod B for the lifetime of the
  # pod. Making this horizontally scalable needs either control-plane reads that
  # go to Postgres, or a periodic resync of the cache, which is the same
  # drift-correction the operator will implement. Tracked as a follow-up.
  #
  # And a PDB would be actively harmful at one replica: minAvailable: 1 makes the
  # pod ineligible for voluntary eviction, so a node drain blocks forever. A PDB
  # earns its place once replicas > 1, not before.
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        # Matches the uid baked into distroless :nonroot. Stated explicitly so
        # the cluster rejects the pod if the image ever changes underneath us.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: grpc-network-gateway:dev
          # The image is built locally and loaded with `kind load docker-image`.
          # It exists in no registry, so any attempt to pull is ImagePullBackOff.
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-db
                  key: DATABASE_URL
          ports:
            - name: grpc
              containerPort: 50051

          # Liveness and readiness deliberately query DIFFERENT health services.
          #
          # Readiness ("" , the overall entry) follows the database: when
          # Postgres is unreachable the pod is removed from the Service and
          # stops receiving traffic.
          #
          # Liveness ("liveness") never does. Restarting a process because its
          # database is down fixes nothing and turns an outage into a restart
          # storm across every replica at once.
          livenessProbe:
            grpc:
              port: 50051
              service: liveness
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50051
              service: ""
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
