apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: netgw
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      # Matches the extraPortMapping in kind/cluster.yaml, so tooling on the
      # host reaches the cluster at 127.0.0.1:50051 with no port-forward.
      nodePort: 30051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: netgw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: grpc-network-gateway:dev
          # The image is built locally and loaded with `kind load docker-image`.
          # It exists in no registry, so any attempt to pull is ImagePullBackOff.
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-db
                  key: DATABASE_URL
          ports:
            - name: grpc
              containerPort: 50051
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
